<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@renz Dev</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  html, body { height:100%; overflow:hidden; }
  body { background:#05050a; color:#e8e8f0; display:flex; align-items:center; justify-content:center; position:relative; }

  .bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .bg-gradient { background:radial-gradient(ellipse at 20% 10%,rgba(255,92,138,.35),transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(127,212,255,.3),transparent 55%),radial-gradient(ellipse at 50% 50%,rgba(255,184,108,.08),transparent 70%); }
  .bg-grid { background-image:linear-gradient(rgba(127,212,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(127,212,255,.06) 1px,transparent 1px); background-size:44px 44px; -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%); mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%); }
  .bg-scan { background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0px,rgba(255,255,255,.02) 1px,transparent 1px,transparent 4px); }

  .wrap { position:relative; z-index:10; width:100%; max-width:440px; padding:20px; max-height:100vh; overflow-y:auto; }
  .wrap::-webkit-scrollbar { width:0; }

  .brand { text-align:center; margin-bottom:22px; position:relative; }
  .brand h1 { font-size:38px; font-weight:900; letter-spacing:4px; background:linear-gradient(180deg,#fff 0%,#ff8fb8 45%,#ff5c8a 70%,#ffb86c 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:brandShine 3s ease-in-out infinite alternate; }
  @keyframes brandShine { from{filter:drop-shadow(0 0 16px rgba(255,92,138,.5))} to{filter:drop-shadow(0 0 30px rgba(255,184,108,.8))} }
  .brand .tagline { color:#7fd4ff; font-size:10px; letter-spacing:6px; margin-top:2px; opacity:.85; }
  .brand::before, .brand::after { content:''; position:absolute; top:50%; width:60px; height:1px; background:linear-gradient(90deg,transparent,#7fd4ff,transparent); }
  .brand::before { left:0; } .brand::after { right:0; }

  .panel { background:linear-gradient(160deg,rgba(18,18,31,.92),rgba(10,10,20,.96)); border:1px solid rgba(127,212,255,.25); border-radius:16px; padding:26px 22px; box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 20px 60px rgba(0,0,0,.7),0 0 80px rgba(255,92,138,.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); position:relative; overflow:hidden; }
  .panel::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#ff5c8a,#7fd4ff,transparent); animation:panelLine 4s linear infinite; }
  @keyframes panelLine { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

  .btn { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:14px; border-radius:10px; border:none; font-size:14px; font-weight:800; letter-spacing:1.2px; cursor:pointer; transition:.2s; text-decoration:none; margin-bottom:10px; position:relative; overflow:hidden; text-transform:uppercase; }
  .btn::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent); transform:translateX(-100%); transition:transform .6s; }
  .btn:hover::after { transform:translateX(100%); }
  .btn:hover { transform:translateY(-2px); } .btn:active { transform:translateY(0); }
  .btn-google { background:#fff; color:#1a1a2e; box-shadow:0 4px 20px rgba(255,255,255,.2); }
  .btn-facebook { background:linear-gradient(135deg,#1877f2,#0a5dc2); color:#fff; box-shadow:0 4px 20px rgba(24,119,242,.4); }
  .btn-github { background:#24292e; color:#fff; border:1px solid rgba(255,255,255,.15); box-shadow:0 4px 20px rgba(255,255,255,.1); }
  .btn-x { background:#000; color:#fff; border:1px solid rgba(255,255,255,.2); box-shadow:0 4px 20px rgba(255,255,255,.1); }
  .btn-line { background:linear-gradient(135deg,#06c755,#04a347); color:#fff; box-shadow:0 4px 20px rgba(6,199,85,.4); }
  .btn-guest { background:linear-gradient(135deg,#2a2a44,#3a3a5a); color:#e8e8f0; border:1px solid rgba(127,212,255,.3); box-shadow:0 4px 20px rgba(127,212,255,.15); }
  .btn-primary { background:linear-gradient(135deg,#ff5c8a,#ff8fb8); color:#fff; box-shadow:0 4px 24px rgba(255,92,138,.5); }
  .btn-ghost { background:rgba(42,42,68,.4); border:1px solid rgba(127,212,255,.2); color:#c8c8d8; }

  .divider { display:flex; align-items:center; gap:12px; color:#4a4a6a; font-size:10px; letter-spacing:3px; margin:16px 0; text-transform:uppercase; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,#2a2a44,transparent); }

  .field { margin-bottom:12px; }
  .field label { display:block; font-size:10px; color:#7fd4ff; letter-spacing:2px; margin-bottom:6px; text-transform:uppercase; font-weight:600; }
  .field input { width:100%; padding:13px 15px; background:rgba(15,15,28,.8); border:1px solid rgba(127,212,255,.2); border-radius:10px; color:#e8e8f0; font-size:14px; transition:.15s; }
  .field input:focus { outline:none; border-color:#7fd4ff; box-shadow:0 0 0 3px rgba(127,212,255,.15),0 0 20px rgba(127,212,255,.2); background:rgba(15,15,28,1); }

  .hidden { display:none; }
  .avatar { width:88px; height:88px; border-radius:50%; margin:0 auto 16px; display:block; object-fit:cover; border:2px solid #7fd4ff; box-shadow:0 0 30px rgba(127,212,255,.4); }
  .center { text-align:center; }
  .step-badge { display:inline-block; background:linear-gradient(90deg,#ff5c8a,#7fd4ff); color:#0a0a12; font-size:10px; font-weight:900; padding:4px 14px; border-radius:12px; letter-spacing:2px; margin-bottom:14px; box-shadow:0 0 20px rgba(127,212,255,.4); }

  .pin-row { display:flex; justify-content:center; gap:8px; margin:16px 0; }
  .pin-box { width:44px; height:54px; background:rgba(15,15,28,.9); border:2px solid rgba(127,212,255,.2); border-radius:10px; text-align:center; font-size:22px; font-weight:800; color:#ffe066; transition:.15s; }
  .pin-box:focus { outline:none; border-color:#7fd4ff; box-shadow:0 0 0 3px rgba(127,212,255,.25),0 0 20px rgba(127,212,255,.3); }
  .pin-box.filled { border-color:#8fffa8; box-shadow:0 0 16px rgba(143,255,168,.4); }

  .error-text { color:#ff5c8a; font-size:12px; text-align:center; margin-top:8px; min-height:16px; }
  .stat-row { display:flex; gap:8px; margin:16px 0; }
  .stat { flex:1; background:rgba(15,15,28,.8); border:1px solid rgba(127,212,255,.2); border-radius:10px; padding:12px; text-align:center; }
  .stat .v { font-size:13px; font-weight:800; color:#ffe066; word-break:break-all; }
  .stat .l { font-size:9px; color:#6a6a8a; letter-spacing:2px; text-transform:uppercase; margin-top:4px; }

  #welcomeOverlay { position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; background:linear-gradient(135deg,#ff5c8a 0%,#ff8fb8 30%,#ffb86c 60%,#7fd4ff 100%); animation:bgPulse 1.5s ease-in-out infinite alternate; padding:20px; text-align:center; }
  #welcomeOverlay.active { display:flex; }
  @keyframes bgPulse { from{filter:brightness(1)} to{filter:brightness(1.25)} }
  .welcome-card { background:rgba(10,10,20,.94); border:3px solid #fff; border-radius:20px; padding:40px 48px; box-shadow:0 0 80px rgba(255,255,255,.5),0 0 160px rgba(255,92,138,.6); animation:welcomePop .6s cubic-bezier(.2,1.5,.5,1); max-width:520px; width:100%; }
  @keyframes welcomePop { 0%{transform:scale(.3) rotate(-8deg);opacity:0} 60%{transform:scale(1.15) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
  .welcome-emoji { font-size:64px; margin-bottom:12px; animation:bounce .8s ease-in-out infinite alternate; display:inline-block; }
  @keyframes bounce { from{transform:translateY(0) rotate(-5deg)} to{transform:translateY(-14px) rotate(5deg)} }
  .welcome-username { font-size:40px; font-weight:900; letter-spacing:2px; background:linear-gradient(90deg,#ff5c8a,#ffb86c,#7fd4ff,#8fffa8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:12px; animation:shimmer 1.2s linear infinite; background-size:200% auto; word-break:break-word; }
  @keyframes shimmer { to{background-position:200% center} }
  .welcome-text { font-size:22px; font-weight:bold; color:#fff; letter-spacing:1px; margin-bottom:8px; }
  .welcome-sub { font-size:14px; color:#ffb86c; letter-spacing:2px; margin-top:16px; animation:blink .8s ease-in-out infinite alternate; }
  @keyframes blink { from{opacity:.5} to{opacity:1} }
  .welcome-progress { width:100%; height:6px; background:rgba(255,255,255,.15); border-radius:3px; margin-top:24px; overflow:hidden; }
  .welcome-progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#ff5c8a,#7fd4ff); border-radius:3px; animation:fillBar 2s linear forwards; }
  @keyframes fillBar { from{width:0%} to{width:100%} }

  @media (max-width:480px) {
    .brand h1 { font-size:30px; letter-spacing:3px; }
    .panel { padding:20px 16px; }
    .pin-box { width:38px; height:48px; font-size:18px; }
  }
</style>
</head>
<body>

<div class="bg-layer bg-gradient"></div>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-scan"></div>

<div class="wrap">
  <div class="brand">
    <h1>@renz Dev</h1>
    <div class="tagline">LOGIN</div>
  </div>

  <!-- LOGIN UTAMA -->
  <div id="screenLogin" class="panel">
    <button class="btn btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Login with Google
    </button>
    <button class="btn btn-facebook" onclick="loginFacebook()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
      Login with Facebook
    </button>
    <button class="btn btn-github" onclick="loginGithub()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      Login with GitHub
    </button>
    <button class="btn btn-x" onclick="loginX()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      Login with X
    </button>
    <button class="btn btn-line" onclick="loginLine()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M24 10.3c0-4.46-4.48-8.1-10-8.1S4 5.84 4 10.3c0 4 3.54 7.36 8.32 7.99.32.07.76.21.87.49.1.25.06.64.03.89l-.14.85c-.04.25-.2 1.01.88.55 1.09-.46 5.86-3.45 7.99-5.91 1.47-1.62 2.05-3.27 2.05-4.86zM9.3 13.22c.02.42-.33.77-.76.77H6.47a.77.77 0 0 1-.77-.77V8.13c0-.42.35-.76.77-.76.42 0 .77.34.77.76v4.33h1.29c.42 0 .76.34.76.76zm2.05 0c0 .42-.35.77-.77.77a.77.77 0 0 1-.77-.77V8.13c0-.42.34-.76.77-.76.42 0 .77.34.77.76v5.09zm5.63 0c0 .33-.21.62-.52.72a.77.77 0 0 1-.93-.35l-2.38-3.51v3.14c0 .42-.34.77-.77.77a.77.77 0 0 1-.76-.77V8.13c0-.33.21-.62.52-.72.1-.03.21-.04.31-.04.24 0 .47.11.61.32l2.39 3.52V8.13c0-.42.34-.76.77-.76.42 0 .77.34.77.76v5.09zm3.53-3.4c.42 0 .77.35.77.77 0 .42-.35.76-.77.76h-1.29v.99h1.29c.42 0 .77.34.77.76 0 .42-.35.77-.77.77h-2.06a.77.77 0 0 1-.77-.77V8.13c0-.42.35-.76.77-.76h2.06c.42 0 .77.34.77.76 0 .42-.35.77-.77.77h-1.29v.92h1.29z"/></svg>
      Login with LINE
    </button>
    <button class="btn btn-guest" onclick="loginGuest()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7fd4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Login as Guest
    </button>
    <div class="divider">ATAU</div>
    <button class="btn btn-primary" onclick="showScreen('screenLoginEmail')">LOGIN PAKE EMAIL</button>
    <button class="btn btn-ghost" onclick="showScreen('screenRegister')">BUAT AKUN BARU</button>
  </div>

  <!-- LOGIN EMAIL -->
  <div id="screenLoginEmail" class="panel hidden">
    <div class="center"><h1 style="font-size:20px;letter-spacing:3px;color:#ff8fb8;margin-bottom:16px;">LOGIN EMAIL</h1></div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="lo@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="password"></div>
    <button class="btn btn-primary" onclick="doEmailLogin()">MASUK</button>
    <button class="btn btn-ghost" onclick="showScreen('screenLogin')">← KEMBALI</button>
  </div>

  <!-- REGISTER -->
  <div id="screenRegister" class="panel hidden">
    <div class="center"><h1 style="font-size:20px;letter-spacing:3px;color:#ff8fb8;margin-bottom:16px;">DAFTAR</h1></div>
    <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="lo@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="regPass" placeholder="min 6 karakter"></div>
    <button class="btn btn-primary" onclick="doRegister()">DAFTAR</button>
    <button class="btn btn-ghost" onclick="showScreen('screenLogin')">← KEMBALI</button>
  </div>

  <!-- USERNAME -->
  <div id="screenUsername" class="panel hidden">
    <div class="center">
      <span class="step-badge">STEP 1 / 2</span>
      <h1 style="font-size:20px;letter-spacing:3px;color:#ff8fb8;margin-bottom:6px;">USERNAME</h1>
      <p style="color:#6a6a8a;font-size:12px;margin-bottom:18px;">Pilih username lo</p>
    </div>
    <div class="field"><label>Username</label><input type="text" id="setupUsername" placeholder="username" maxlength="20" autocomplete="off"></div>
    <button class="btn btn-primary" onclick="submitUsername()">LANJUT</button>
    <div class="error-text" id="usernameError"></div>
  </div>

  <!-- PIN -->
  <div id="screenPin" class="panel hidden">
    <div class="center">
      <span class="step-badge">STEP 2 / 2</span>
      <h1 style="font-size:20px;letter-spacing:3px;color:#ff8fb8;margin-bottom:6px;">BUAT PIN</h1>
      <p style="color:#6a6a8a;font-size:12px;margin-bottom:18px;">6 digit — jangan lupa</p>
    </div>
    <div class="pin-row" id="pinRow1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
    </div>
    <button class="btn btn-primary" onclick="submitPin1()">LANJUT</button>
    <div class="error-text" id="pin1Error"></div>
  </div>

  <!-- KONFIRMASI PIN -->
  <div id="screenPinConfirm" class="panel hidden">
    <div class="center">
      <span class="step-badge">KONFIRMASI</span>
      <h1 style="font-size:20px;letter-spacing:3px;color:#ff8fb8;margin-bottom:6px;">ULANGI PIN</h1>
      <p style="color:#6a6a8a;font-size:12px;margin-bottom:18px;">Masukkan lagi biar lo inget</p>
    </div>
    <div class="pin-row" id="pinRow2">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1">
    </div>
    <button class="btn btn-primary" onclick="submitPin2()">SIMPAN</button>
    <div class="error-text" id="pin2Error"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="screenDashboard" class="panel hidden">
    <div class="center"><h1 style="font-size:20px;letter-spacing:3px;color:#ff8fb8;margin-bottom:16px;">DASHBOARD</h1></div>
    <img id="dashAvatar" class="avatar" src="" alt="">
    <h2 class="center" id="dashName" style="margin-bottom:4px;">—</h2>
    <p class="center" id="dashEmail" style="color:#6a6a8a;font-size:12px;margin-bottom:16px;">—</p>
    <div class="stat-row">
      <div class="stat"><div class="v" id="dashProvider">—</div><div class="l">Provider</div></div>
      <div class="stat"><div class="v" id="dashPin">●●●●●●</div><div class="l">PIN</div></div>
    </div>
    <button class="btn btn-ghost" onclick="logout()">LOGOUT</button>
  </div>

</div>

<!-- WELCOME OVERLAY -->
<div id="welcomeOverlay">
  <div class="welcome-card">
    <div class="welcome-emoji">🎉</div>
    <div class="welcome-username" id="welcomeUsername">username</div>
    <div class="welcome-text">halo selamat datang mwhwheh</div>
    <div class="welcome-sub">Mengarahkan ke KiosGamer...</div>
    <div class="welcome-progress"><div class="welcome-progress-fill"></div></div>
  </div>
</div>

<!-- INI YANG LO MINTA, SUDAH GW TAMBAHIN -->
<script type="module" src="app.js"></script>

</body>
</html>
